    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-profile-tab" data-bs-toggle="tab" data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">CUENTAS</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-contact-tab" data-bs-toggle="tab" data-bs-target="#pills-contact" type="button" role="tab" aria-controls="pills-contact" aria-selected="false">MOVIMIENTOS</button>

  <div class="tab-content" id="pills-tabContent">
    <div class="tab-pane show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab" tabindex="0">
      
      <h1 class="centro mt-6">Bienvenido a Usuarios</h1>

      <h1>Usuarios registrados</h1>
      <div id="contenedor-cartas" class="cards-grid"></div>
      
    </div>
    <div class="tab-pane" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab" tabindex="0">
      <h1 class="centro mt-6">Bienvenido a Cuentas</h1>

      <div class="card col-6 cartita">
        <div class="card-body">

        
        <label for="exampleFormControlInput" class="form-label mb-2">Nombre</label>
        <input type="name" class="form-control" id="exampleFormControlInput" >
    
        <label for="exampleFormControlInput" class="form-label mb-2">Tipo</label>
        <input type="type" class="form-control" id="exampleFormControlInput" >
    
        <label for="exampleFormControlInput" class="form-label mb-2">Nombre</label>
        <input type="number" class="form-control" id="exampleFormControlInput" >

        <label for="exampleFormControlInput" class="form-label mb-2">Saldo</label>
        <input type="char" class="form-control" id="exampleFormControlInput">
        <div class="ladito mt-6">
          <button type="button" class="btn-solid theme-primary btn-lg">Guardar</button>
          <button type="button" class="btn-solid theme-secondary btn-lg">cancelar</button>
        </div>
        
        <div class="table-card">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
              </tr>
            </thead>
          </table>
        </div>

        </div>
      </div>
      
    </div>
    <div class="tab-pane" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab" tabindex="0">
      
      <h1 class="centro mt-6">Bienvenido a Movimientos</h1>

      <div class="card col-6 cartita">
        <div class="card-body">
        
        
        <label for="exampleFormControlInput" class="form-label mb-2">Nombre</label>
        <input type="name" class="form-control" id="exampleFormControlInput" >
    
        <label for="exampleFormControlInput" class="form-label mb-2">Correo</label>
        <input type="email" class="form-control" id="exampleFormControlInput" >
    
        <label for="exampleFormControlInput" class="form-label mb-2">Fecha de Registro</label>
        <input type="date" class="form-control" id="exampleFormControlInput">
        <div class="ladito mt-6">
          <button type="button" class="btn-solid theme-primary btn-lg">Guardar</button>
          <button type="button" class="btn-solid theme-secondary btn-lg">cancelar</button>
        </div>
        
        <div class="table-card">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
              </tr>
            </thead>
          </table>
        </div>

        </div>
      </div>
      
    

    </div>
    
  </div>
